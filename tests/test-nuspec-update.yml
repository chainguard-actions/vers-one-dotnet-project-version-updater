name: Test nuspec file version update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test nuspec file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp"
          cat > "$GITHUB_WORKSPACE/tests/tmp/MyPackage.nuspec" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2010/07/nuspec.xsd">
              <metadata>
                  <id>MyPackage</id>
                  <version>0.5.1</version>
                  <authors>Test Author</authors>
                  <description>A test package</description>
              </metadata>
          </package>
          EOF

      - id: action
        uses: .
        with:
          file: tests/tmp/MyPackage.nuspec
          version: "1.0.0-beta1"

      - name: Assert oldVersion output
        env:
          OLD_VERSION: ${{ steps.action.outputs.oldVersion }}
        run: |
          echo "oldVersion: $OLD_VERSION"
          if [ "$OLD_VERSION" != "0.5.1" ]; then
            echo "FAIL: expected oldVersion to be '0.5.1', got '$OLD_VERSION'"
            exit 1
          fi
          echo "PASS: oldVersion is correct"

      - name: Assert newVersion output
        env:
          NEW_VERSION: ${{ steps.action.outputs.newVersion }}
        run: |
          echo "newVersion: $NEW_VERSION"
          if [ "$NEW_VERSION" != "1.0.0-beta1" ]; then
            echo "FAIL: expected newVersion to be '1.0.0-beta1', got '$NEW_VERSION'"
            exit 1
          fi
          echo "PASS: newVersion is correct"

      - name: Assert nuspec file was updated
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tests/tmp/MyPackage.nuspec")
          echo "File content:"
          echo "$CONTENT"
          if echo "$CONTENT" | grep -q "<version>1.0.0-beta1</version>"; then
            echo "PASS: version element updated in nuspec"
          else
            echo "FAIL: version element not updated to 1.0.0-beta1 in nuspec"
            exit 1
          fi
          if echo "$CONTENT" | grep -q "0.5.1"; then
            echo "FAIL: Old version 0.5.1 still present in nuspec"
            exit 1
          fi
          echo "PASS: nuspec file content is correct"
