name: Test tag filter for selective version update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test csproj file with multiple version tags
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp"
          cat > "$GITHUB_WORKSPACE/tests/tmp/TagFilter.csproj" << 'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
              <PropertyGroup>
                  <Version>1.0.0</Version>
                  <AssemblyVersion>1.0.0</AssemblyVersion>
                  <FileVersion>1.0.0</FileVersion>
              </PropertyGroup>
          </Project>
          EOF

      - id: action
        uses: .
        with:
          file: tests/tmp/TagFilter.csproj
          version: "9.9.9"
          tags: "csproj.Version"

      - name: Assert newVersion output
        env:
          NEW_VERSION: ${{ steps.action.outputs.newVersion }}
        run: |
          echo "newVersion: $NEW_VERSION"
          if [ "$NEW_VERSION" != "9.9.9" ]; then
            echo "FAIL: expected newVersion to be '9.9.9', got '$NEW_VERSION'"
            exit 1
          fi
          echo "PASS: newVersion is correct"

      - name: Assert only Version tag was updated, not AssemblyVersion or FileVersion
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tests/tmp/TagFilter.csproj")
          echo "File content:"
          echo "$CONTENT"
          if echo "$CONTENT" | grep -q "<Version>9.9.9</Version>"; then
            echo "PASS: Version tag updated"
          else
            echo "FAIL: Version tag not updated to 9.9.9"
            exit 1
          fi
          if echo "$CONTENT" | grep -q "<AssemblyVersion>1.0.0</AssemblyVersion>"; then
            echo "PASS: AssemblyVersion tag was NOT updated (tag filter worked)"
          else
            echo "FAIL: AssemblyVersion tag was unexpectedly updated"
            exit 1
          fi
          if echo "$CONTENT" | grep -q "<FileVersion>1.0.0</FileVersion>"; then
            echo "PASS: FileVersion tag was NOT updated (tag filter worked)"
          else
            echo "FAIL: FileVersion tag was unexpectedly updated"
            exit 1
          fi
