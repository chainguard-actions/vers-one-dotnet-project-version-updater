name: Test bump-minor version command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test csproj file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/tmp"
          cat > "$GITHUB_WORKSPACE/tests/tmp/BumpTest.csproj" << 'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
              <PropertyGroup>
                  <Version>3.1.0</Version>
              </PropertyGroup>
          </Project>
          EOF

      - id: action
        uses: .
        with:
          file: tests/tmp/BumpTest.csproj
          version: "bump-minor"

      - name: Assert oldVersion output
        env:
          OLD_VERSION: ${{ steps.action.outputs.oldVersion }}
        run: |
          echo "oldVersion: $OLD_VERSION"
          if [ "$OLD_VERSION" != "3.1.0" ]; then
            echo "FAIL: expected oldVersion to be '3.1.0', got '$OLD_VERSION'"
            exit 1
          fi
          echo "PASS: oldVersion is correct"

      - name: Assert newVersion output (minor bumped)
        env:
          NEW_VERSION: ${{ steps.action.outputs.newVersion }}
        run: |
          echo "newVersion: $NEW_VERSION"
          if [ "$NEW_VERSION" != "3.2.0" ]; then
            echo "FAIL: expected newVersion to be '3.2.0' after bump-minor, got '$NEW_VERSION'"
            exit 1
          fi
          echo "PASS: newVersion is correctly bumped"

      - name: Assert file was updated with bumped version
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/tests/tmp/BumpTest.csproj")
          echo "File content:"
          echo "$CONTENT"
          if echo "$CONTENT" | grep -q "<Version>3.2.0</Version>"; then
            echo "PASS: Version tag bumped correctly"
          else
            echo "FAIL: Version tag not bumped to 3.2.0"
            exit 1
          fi
